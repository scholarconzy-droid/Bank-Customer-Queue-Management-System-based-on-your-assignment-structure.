<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Customer Queue Management System</title>
    <!-- Tailwind CSS CDN for modern, clean styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-md py-6 px-6">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">First National Bank</h1>
                <p class="text-blue-100 text-sm">Customer Queue Management System (FIFO Data Structure)</p>
            </div>
            <div class="mt-4 sm:mt-0 bg-blue-800 px-4 py-2 rounded-lg border border-blue-600 text-center">
                <span class="block text-xs text-blue-200 uppercase tracking-wider">Waiting in Line</span>
                <span id="badge-count" class="text-2xl font-black">0</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full p-4 sm:p-6 my-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Column: Controls & Actions -->
        <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Queue Operations</h2>
                
                <!-- Enqueue Form -->
                <div class="mb-5">
                    <label for="customerName" class="block text-sm font-medium text-slate-700 mb-1">Customer Name</label>
                    <input type="text" id="customerName" placeholder="e.g., Ama Mensah" 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 mb-2">
                    <button onclick="addCustomer()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-sm">
                        ➕ Enqueue (Add to Line)
                    </button>
                </div>

                <!-- Dequeue Control -->
                <div class="mb-5">
                    <button onclick="serveCustomer()" 
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 shadow-sm">
                        🔔 Serve Next (Dequeue)
                    </button>
                </div>
            </div>

            <!-- Recently Served Alert / Notice -->
            <div id="served-alert" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 p-3 rounded-lg text-sm mt-4">
                <span class="font-bold">Now Serving:</span> <span id="served-name">-</span>
            </div>
        </div>

        <!-- Right Column: Visual Queue Display -->
        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
            <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex justify-between items-center">
                <span>Waiting Queue (FIFO Line)</span>
                <span class="text-xs font-normal text-slate-500">Front is at the top</span>
            </h2>

            <!-- Queue List Container -->
            <div id="queue-container" class="flex-1 space-y-3 min-h-[250px] overflow-y-auto pr-1">
                <!-- Empty State Placeholder -->
                <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400 py-12">
                    <svg class="w-12 h-12 mb-2 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
                    </svg>
                    <p class="text-sm font-medium">The queue is currently empty.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Bank Customer Queue Management System &bull; Built for Data Structures Assignment
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Core Array representing our Queue
        const queue = [];

        // DOM Elements
        const customerNameInput = document.getElementById('customerName');
        const queueContainer = document.getElementById('queue-container');
        const emptyState = document.getElementById('empty-state');
        const badgeCount = document.getElementById('badge-count');
        const servedAlert = document.getElementById('served-alert');
        const servedNameSpan = document.getElementById('served-name');

        // Allow pressing 'Enter' key to enqueue
        customerNameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addCustomer();
            }
        });

        // ENQUEUE OPERATION: Adds a customer to the back of the queue
        function addCustomer() {
            const name = customerNameInput.value.trim();
            
            // Input Validation
            if (name === "") {
                alert("Please enter a valid customer name.");
                return;
            }

            // Push to the back of the array
            queue.push(name);
            
            // Clear input & refresh view
            customerNameInput.value = "";
            customerNameInput.focus();
            updateQueueUI();
        }

        // DEQUEUE OPERATION: Removes the customer from the front of the queue
        function serveCustomer() {
            if (queue.length === 0) {
                alert("No customers waiting in the queue!");
                return;
            }

            // Shift removes the first item (FIFO principle)
            const servedCustomer = queue.shift();

            // Show service notification
            servedNameSpan.textContent = servedCustomer;
            servedAlert.classList.remove('hidden');

            updateQueueUI();
        }

        // RENDER FUNCTION: Updates the HTML DOM to reflect the current queue array
        function updateQueueUI() {
            // Update counter badge
            badgeCount.textContent = queue.length;

            // Handle empty state display
            if (queue.length === 0) {
                queueContainer.innerHTML = `
                    <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400 py-12">
                        <svg class="w-12 h-12 mb-2 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
                        </svg>
                        <p class="text-sm font-medium">The queue is currently empty.</p>
                    </div>`;
                return;
            }

            // Build list items for each person in the queue array
            let htmlContent = '';
            queue.forEach((customer, index) => {
                const isFront = index === 0;
                htmlContent += `
                    <div class="flex items-center justify-between p-3 rounded-lg border ${isFront ? 'bg-blue-50 border-blue-300 shadow-sm' : 'bg-slate-50 border-slate-200'} transition-all">
                        <div class="flex items-center space-x-3">
                            <span class="w-7 h-7 flex items-center justify-center rounded-full ${isFront ? 'bg-blue-600 text-white font-bold' : 'bg-slate-200 text-slate-700'} text-xs">
                                #${index + 1}
                            </span>
                            <span class="font-semibold text-slate-800">${escapeHtml(customer)}</span>
                        </div>
                        <div>
                            ${isFront ? '<span class="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-1 rounded">Next to Serve (Front)</span>' : '<span class="text-xs text-slate-400">Waiting</span>'}
                        </div>
                    </div>
                `;
            });

            queueContainer.innerHTML = htmlContent;
        }

        // Security helper to prevent XSS injection
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
